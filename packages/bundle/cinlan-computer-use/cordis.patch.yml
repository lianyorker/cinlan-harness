# The opt-in native desktop Computer Use layer follows dsh-base.
# CUA owns its catalog; the policy guards every native tool invocation.

- insert:
    - id: computer-use
      name: '@deepseek-ai/dsh-computer-use'
      config:
        provider: cua-driver-native

    - id: computer-use-permission-policy
      name: '@deepseek-ai/dsh-computer-use-permission-policy'
      config:
        native: ask

    - id: computer-use-cua-driver-native
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-native'

# Security Research capability layer. Assessment actions remain denied until
# the profile owner adds authorized targets and actions in a later patch.
- insert:
    - id: security-research-presets
      name: '@deepseek-ai/dsh-security-research'


    - id: artifact-local
      name: '@deepseek-ai/dsh-artifact-local'

    - id: assessment-scope
      name: '@deepseek-ai/dsh-assessment-scope-settings'
      config:
        root:
          engagementId: security-research
          grantId: security-research-root
          authorizationRef: security-research-profile
          notBefore: 0
          expiresAt: 9007199254740991
          executionHostIds:
            - local
          targets:
            - id: local-workspace
              kind: hostname
              value: localhost
          excludedTargetIds: []
          actions:
            - active-validation
            - reconnaissance
          approvalRequiredActions: []
          egress: []
          credentials: []
          evidence:
            retainUntil: 9007199254740991
            minimumRedaction: sensitive
            externalReporting: deny

    - id: assessment-scope-session
      name: '@deepseek-ai/dsh-assessment-scope-session'
    - id: assessment-scope-tool-policy
      name: '@deepseek-ai/dsh-assessment-scope-tool-policy'
      config:
        shellTools:
          - bash
          - pwsh
          - mcp__rea__rizin_debug_command
          - mcp__rea__install_adb_package
        networkTools:
          - web_search
          - web_fetch
          - nmap_scan
          - httpx_probe
          - subfinder_enum
          - naabu_scan
          - nuclei_scan
          - ffuf_fuzz
          - masscan_scan
          - katana_crawl
          - gau_urls
          - mcp__rea__capture_browser_scenario
        credentialTools:
          - bloodhound_enum
          - kerberoast
          - asrep_roast
          - secrets_dump
          - nxc_spray
          - adcs_find
          - sts_get_caller_identity
          - az_account_show
          - gcp_identity_get
          - aliyun_identity_get
          - tencent_identity_get
          - huawei_identity_get
        exploitTools:
          - responder_capture
          - ntlm_relay
        persistenceTools:
          - rbcd
        cloudTools:
          - iam_enum
          - s3_enum
          - azure_ad_enum
          - azure_storage_enum
          - gcp_iam_enum
          - gcs_enum
          - gcs_bucket_iam
          - ram_enum
          - oss_enum
          - cam_enum
          - cos_enum
          - huawei_iam_enum
          - obs_enum
        cloudWriteTools:
          - iam_policy_attach
          - iam_policy_detach
          - role_assignment_create
          - role_assignment_delete
          - iam_binding_add
          - iam_binding_remove
          - ram_policy_attach
          - ram_policy_detach
          - cam_policy_attach
          - cam_policy_detach
          - iam_group_add_user
          - iam_group_remove_user
        browserTools:
          - browser_list
          - browser_snapshot
          - browser_screenshot
          - browser_select_element
          - browser_capture_element
          - browser_downloads
          - browser_upload
          - browser_save_download
          - browser_history
          - browser_network
          - browser_home
          - browser_search
          - browser_back
          - browser_forward
          - browser_open
          - browser_navigate
          - browser_click
          - browser_close
        workspaceCommands:
          - { tool: pwsh, command: pwd }
          - { tool: pwsh, command: pnpm install }
          - { tool: pwsh, command: Get-Location }
          - { tool: pwsh, command: Get-ChildItem }
          - { tool: pwsh, command: pnpm --version }
          - { tool: pwsh, command: pnpm run typecheck }
          - { tool: pwsh, command: pnpm run build }
          - { tool: pwsh, command: pnpm run test }
          - { tool: bash, command: pwd }
          - { tool: bash, command: ls }
          - { tool: bash, command: pnpm --version }
          - { tool: bash, command: pnpm run typecheck }
          - { tool: bash, command: pnpm run build }
          - { tool: bash, command: pnpm run test }



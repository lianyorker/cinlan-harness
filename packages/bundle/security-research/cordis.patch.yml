# Security Research capability layer. Assessment actions remain denied until
# the profile owner adds authorized targets and actions in a later patch.
- insert:
    - id: security-research-presets
      name: '@deepseek-ai/dsh-security-research'


    - id: artifact-local
      name: '@deepseek-ai/dsh-artifact-local'

    - id: assessment-scope
      name: '@deepseek-ai/dsh-assessment-scope-settings'
      config:
        root:
          engagementId: security-research
          grantId: security-research-root
          authorizationRef: security-research-profile
          notBefore: 0
          expiresAt: 9007199254740991
          executionHostIds:
            - local
          targets:
            - id: local-workspace
              kind: hostname
              value: localhost
          excludedTargetIds: []
          actions:
            - active-validation
            - reconnaissance
          approvalRequiredActions: []
          egress: []
          credentials: []
          evidence:
            retainUntil: 9007199254740991
            minimumRedaction: sensitive
            externalReporting: deny

    - id: assessment-scope-session
      name: '@deepseek-ai/dsh-assessment-scope-session'
    - id: assessment-scope-tool-policy
      name: '@deepseek-ai/dsh-assessment-scope-tool-policy'
      config:
        shellTools:
          - bash
          - pwsh
          - mcp__rea__rizin_debug_command
          - mcp__rea__install_adb_package
        networkTools:
          - web_search
          - web_fetch
          - nmap_scan
          - httpx_probe
          - subfinder_enum
          - naabu_scan
          - nuclei_scan
          - ffuf_fuzz
          - masscan_scan
          - katana_crawl
          - gau_urls
          - mcp__rea__capture_browser_scenario
        credentialTools:
          - bloodhound_enum
          - kerberoast
          - asrep_roast
          - secrets_dump
          - nxc_spray
        browserTools:
          - browser_list
          - browser_snapshot
          - browser_screenshot
          - browser_select_element
          - browser_capture_element
          - browser_downloads
          - browser_upload
          - browser_save_download
          - browser_history
          - browser_network
          - browser_home
          - browser_search
          - browser_back
          - browser_forward
          - browser_open
          - browser_navigate
          - browser_click
          - browser_close
        workspaceCommands:
          - { tool: pwsh, command: pwd }
          - { tool: pwsh, command: pnpm install }
          - { tool: pwsh, command: Get-Location }
          - { tool: pwsh, command: Get-ChildItem }
          - { tool: pwsh, command: pnpm --version }
          - { tool: pwsh, command: pnpm run typecheck }
          - { tool: pwsh, command: pnpm run build }
          - { tool: pwsh, command: pnpm run test }
          - { tool: bash, command: pwd }
          - { tool: bash, command: ls }
          - { tool: bash, command: pnpm --version }
          - { tool: bash, command: pnpm run typecheck }
          - { tool: bash, command: pnpm run build }
          - { tool: bash, command: pnpm run test }


    - id: finding-session
      name: '@deepseek-ai/dsh-finding-session'

    - id: vuln-kb
      name: '@deepseek-ai/dsh-vuln-kb-service'
    - id: vuln-kb-nvd
      name: '@deepseek-ai/dsh-vuln-kb-nvd'
    - id: tool-vuln-kb
      name: '@deepseek-ai/dsh-tool-vuln-kb'

    - id: vuln-playbook
      name: '@cinlan/vuln-playbook'
    - id: engagement-ledger
      name: '@cinlan/engagement-ledger'
    - id: tool-nmap
      name: '@cinlan/tool-nmap'
    - id: tool-httpx
      name: '@cinlan/tool-httpx'
    - id: tool-subfinder
      name: '@cinlan/tool-subfinder'
    - id: tool-naabu
      name: '@cinlan/tool-naabu'
    - id: tool-nuclei
      name: '@cinlan/tool-nuclei'
    - id: tool-ffuf
      name: '@cinlan/tool-ffuf'
    - id: tool-masscan
      name: '@cinlan/tool-masscan'
    - id: tool-katana
      name: '@cinlan/tool-katana'
    - id: tool-gau
      name: '@cinlan/tool-gau'
    - id: tool-bloodhound
      name: '@cinlan/tool-bloodhound'
    - id: tool-impacket
      name: '@cinlan/tool-impacket'
    - id: tool-nxc
      name: '@cinlan/tool-nxc'

    - id: security-workflow-prompt
      name: '@deepseek-ai/dsh-security-workflow-prompt'

    - id: tool-finding
      name: '@deepseek-ai/dsh-tool-finding'

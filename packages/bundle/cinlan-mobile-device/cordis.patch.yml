# The Cinlan Mobile Device layer follows dsh-base. Web and Desktop include it;
# custom profiles can select the same approval-gated composition.

- insert:
    - id: mobile-device
      name: '@deepseek-ai/dsh-mobile-device'
      config:
        provider: adb

    - id: mobile-device-runtime
      name: '@deepseek-ai/dsh-mobile-device-runtime'

    - id: mobile-device-adb
      name: '@deepseek-ai/dsh-mobile-device-adb'
      config:
        providerId: adb

    - id: mobile-device-permission-policy
      name: '@deepseek-ai/dsh-mobile-device-permission-policy'
      config:
        observe: ask
        touch: ask
        textInput: ask
        deviceNavigation: ask

    - id: tool-mobile-device
      name: '@deepseek-ai/dsh-tool-mobile-device'

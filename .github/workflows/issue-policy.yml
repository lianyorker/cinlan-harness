name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    env:
      DSH_PROJECT_AUTOMATION: ${{ github.repository == 'deepseek-harness/deepseek-harness' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report unavailable Project policy
        if: ${{ env.DSH_PROJECT_AUTOMATION != 'true' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' }}
        run: echo "::notice::Issue Project policy runs only for trusted events in deepseek-harness/deepseek-harness."
      - name: Create Project read token
        id: app-token
        if: ${{ env.DSH_PROJECT_AUTOMATION == 'true' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: deepseek-harness
          repositories: deepseek-harness
          permission-issues: read
          permission-organization-projects: read
      - name: Validate pull request
        if: ${{ env.DSH_PROJECT_AUTOMATION == 'true' && github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.type != 'App' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs pr

const STORAGE_KEY='cinlan-settings-native-preview-1';
let storageAvailable=true;
let saved={};
try{saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');if(!saved||typeof saved!=='object')saved={};}catch{saved={};storageAvailable=false;}
const state={values:saved.values&&typeof saved.values==='object'?saved.values:{},lists:{},folded:{},pluginTab:'host'};
for(const [key,rows]of Object.entries(SEED))state.lists[key]=Array.isArray(saved.lists?.[key])?saved.lists[key]:structuredClone(rows);
let active=PAGES[location.hash.slice(1)]?location.hash.slice(1):'general';
let query='';let toastTimer;let statusTimer;let dialogSubmit=null;let shortcutDraft='';
const $=(id)=>document.getElementById(id);
const groupFor=(page)=>GROUPS.find(g=>g.pages.includes(page));
const rowFor=(page,id)=>PAGES[page].sections.flatMap(s=>s.rows).find(r=>r.id===id);
const val=(page,id)=>Object.hasOwn(state.values,page+'.'+id)?state.values[page+'.'+id]:rowFor(page,id)?.value;
const opt=(entry)=>{const parts=entry.split('|');return {id:parts[0],label:parts.slice(1).join('|')||parts[0]};};
function optionsFor(page,row){if(page==='presets'&&row.id==='default')return state.lists.presets.map(p=>p.id+'|'+p.name);if(page==='models'&&row.id==='default'){const options=[...row.options];for(const p of state.lists.providers)if(p.model&&!options.some(o=>opt(o).id===p.model))options.push(p.model+'|'+p.model+' · '+p.name);return options;}return row.options;}
function toast(text){clearTimeout(toastTimer);$('toast').innerHTML=icon('check')+'<span>'+esc(text)+'</span>';$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({values:state.values,lists:state.lists}));storageAvailable=true;}catch{storageAvailable=false;}
$('save-status').innerHTML='<i class="status-dot"></i>'+(storageAvailable?'已保存到此浏览器':'仅在本次预览中保留');clearTimeout(statusTimer);statusTimer=setTimeout(()=>$('save-status').innerHTML='<i class="status-dot"></i>'+(storageAvailable?'更改自动保存在本地':'本地存储不可用'),3000);}
function applyTheme(){const mode=val('general','theme');document.documentElement.dataset.theme=mode==='dark'||mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
function change(page,id,value){state.values[page+'.'+id]=value;persist();if(page==='general'&&id==='theme')applyTheme();}
function renderNav(){const oldScroll=$('navigation').scrollTop;$('navigation').innerHTML=GROUPS.map(g=>'<div class="nav-group"><button class="group-title" data-group="'+g.id+'" aria-expanded="'+!state.folded[g.id]+'" aria-controls="group-'+g.id+'"><span>'+g.label+'</span>'+icon('chevronDown')+'</button><div id="group-'+g.id+'" '+(state.folded[g.id]?'hidden':'')+'>'+g.pages.map(id=>'<button class="nav-item '+(active===id&&!query?'active':'')+'" data-page="'+id+'" '+(active===id&&!query?'aria-current="page"':'')+'>'+icon(PAGES[id].icon)+'<span class="nav-label">'+PAGES[id].label+'</span></button>').join('')+'</div></div>').join('');$('navigation').scrollTop=oldScroll;}
function button(label,actionName,iconName='',kind=''){return '<button type="button" class="button '+kind+'" data-action="'+esc(actionName)+'">'+(iconName?icon(iconName):'')+esc(label)+'</button>';}
function isEnabled(page,row){return (!row.depends||val(page,row.depends))&&(!row.dependsSelect||val(page,row.dependsSelect[0])===row.dependsSelect[1]);}
function rowHTML(page,row){const key=page+'.'+row.id;const value=val(page,row.id);const disabled=isEnabled(page,row)?'':' disabled';const attrs=' data-setting="'+key+'" aria-labelledby="label-'+key+'"'+(row.description?' aria-describedby="desc-'+key+'"':'')+disabled;let control='';
if(row.type==='theme')return '<div class="theme-row" id="row-'+key+'"><div class="setting-label" id="label-'+key+'">'+row.label+'</div><div class="themes" role="group" aria-labelledby="label-'+key+'">'+[['light','sun','浅色'],['dark','moon','深色'],['system','monitor','跟随系统']].map(([id,ic,label])=>'<button type="button" class="theme-option" data-theme-choice="'+id+'" aria-pressed="'+(value===id)+'">'+icon(ic)+label+'</button>').join('')+'</div></div>';

function editEntry(collection,id){const record=state.lists[collection]?.find(r=>r.id===id);if(!record||record.readonly)return;let body='<p class="form-help">只编辑此浏览器中的演示记录。</p>'+formField('name','名称',record.name);
if(collection==='presets')body+=formField('description','用途说明',record.detail);
else{if(collection==='mcp')body+=formSelect('transport','传输方式',['http|Streamable HTTP','stdio|stdio'],record.transport||'http');const known={deepseek:'https://api.deepseek.com',openai:'https://api.openai.com/v1',github:'https://github.com',linear:'https://api.linear.app',gitlab:'https://gitlab.com',pixel:'emulator-5554',remote:'dev.example.com'};body+=formField('endpoint',collection==='devices'?'设备标识':collection==='mcp'?'服务地址 / 启动命令':'服务地址',record.endpoint||known[id]||record.detail);if(collection==='providers')body+=formField('model','模型标识',record.model||(id==='deepseek'?'deepseek-v4':id==='openai'?'gpt-6-astra':''));}
openDialog('编辑“'+record.name+'”',body,cancelButton+saveButton,data=>{const name=String(data.get('name')).trim();if(!name)return formError('请输入名称。');if(state.lists[collection].some(r=>r.id!==id&&r.name===name))return formError('此名称已存在。');const endpoint=String(data.get('endpoint')||'').trim();if((collection==='providers'||collection==='integrations'||collection==='mcp'&&data.get('transport')==='http')&&!/^https?:\/\/[^\s]+$/i.test(endpoint))return formError('请输入有效的 HTTP 或 HTTPS 地址。');record.name=name;
if(collection==='presets')record.detail=String(data.get('description')).trim();else{record.endpoint=endpoint;record.detail=endpoint;record.status=collection==='devices'?'未连接（示例）':'配置已更新';if(collection==='providers'){record.model=String(data.get('model')).trim();record.detail=endpoint+' · '+record.model;record.status='待配置凭据';}if(collection==='mcp'){record.transport=data.get('transport');record.detail=(record.transport==='http'?'Streamable HTTP':'stdio')+' · '+endpoint;}}
persist();$('dialog').close();renderPage(true);toast('演示记录已更新');});}
function previewConfig(){const entries={};for(const [pageId,page]of Object.entries(PAGES))for(const s of page.sections)for(const r of s.rows)if(r.type!=='action'){entries[pageId]??={};entries[pageId][r.id]=val(pageId,r.id);}return {format:'cinlan-settings-preview',version:1,notice:'仅供交互评审；不是 Harness 可直接导入的配置。',preferences:entries,examples:state.lists};}
function download(filename,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function about(){openDialog('关于这份设置预览','<p>保留当前 Harness 通用设置的侧栏、单列行式布局、胶囊控件与外观选项。功能按六组、25 个页面组织。</p><table class="mapping"><tr><th>配置内容</th><th>实际归属</th></tr><tr><td>用户偏好</td><td>主机 settings.yaml，按插件命名空间管理；默认值 → 组合基础值 → 用户覆盖。</td></tr><tr><td>Agent 预设</td><td>独立 agent.cordis.yml；默认预设作用于新会话。</td></tr><tr><td>模型与凭据</td><td>提供商配置与密钥分别管理。会话模型选择也会保存为未来 Agent 的默认值。</td></tr><tr><td>工作区与主机</td><td>独立管理的记录与执行环境，不构成通用的偏好继承层级。</td></tr><tr><td>插件扩展</td><td>功能插件提供各自页面、设置项与校验；清单只读查看。</td></tr></table><p><strong>已核对的接入范围</strong></p><p>通知与本地语音已有能力；工单当前支持 GitHub / Linear；MCP 只桥接 Tools。浮动工作区与部分设备偏好已能保存，运行接入仍需补齐。计划管理、元素捕获和设计产物设置用于展示扩展方案。</p><p class="form-help">所有交互与示例数据保存在此浏览器，未连接 Harness 后端。未读取 -warm、v2–v4 实现；未使用 cinlan-design 技能。</p>',null,null,true);}
function runAction(name){if(name.startsWith('goto:')){if($('dialog').open)$('dialog').close();return navigate(name.slice(5));}if(name.startsWith('add-'))return addEntry(name.slice(4));if(name.startsWith('detail:')){const [,collection,id]=name.split(':');return detail(collection,id);}if(name.startsWith('copy-preset:'))return addEntry('preset',state.lists.presets.find(p=>p.id===name.split(':')[1]));
if(name.startsWith('edit-entry:')){const [,collection,id]=name.split(':');return editEntry(collection,id);}
if(name.startsWith('test:')){const [,collection,id]=name.split(':');const r=state.lists[collection].find(x=>x.id===id);r.status='检查通过（模拟）';persist();detail(collection,id);renderPage(true);return toast('模拟检查完成；未连接外部服务');}
if(name.startsWith('remove:')){const [,collection,id]=name.split(':');const r=state.lists[collection].find(x=>x.id===id);return openDialog('移除“'+r.name+'”？','<p>只移除这个 HTML 中的演示记录，不会删除真实配置或资源。</p>',cancelButton+'<button type="submit" class="button danger">移除演示记录</button>',()=>{state.lists[collection]=state.lists[collection].filter(x=>x.id!==id);if(collection==='presets'&&val('presets','default')===id)delete state.values['presets.default'];if(collection==='providers'&&r.model===val('models','default'))delete state.values['models.default'];persist();$('dialog').close();renderPage(true);toast('演示记录已移除');});}
if(name.startsWith('detect-')){const device=name.slice(7);state.values['demo.'+(device==='voice'?'voiceReady':device)]=true;persist();renderPage(true);return toast('模拟检测完成，实际环境未被访问');}
if(name.startsWith('coverage:'))return openDialog(name.endsWith('subagent')?'子智能体':'工作流','<p>由当前预设加载的插件提供协作能力。主智能体负责分派任务、收集结果与完成后的验证。</p><p>设置页展示支持范围与默认偏好；实际任务仍从会话发起。</p>');
if(name.startsWith('task:'))return openDialog('任务工作树记录','<div class="code-preview">仓库：cinlan-harness\n分支：cinlan/'+esc(name.slice(5))+'\n基准：main\n状态：等待审查\n更改：3 个文件（示例）</div><p class="inline-tip">正式接入后，在任务页面审查差异、导出或合并。本预览不执行 Git 操作。</p>');
switch(name){
case 'about':return about();case 'back':return openDialog('独立设置预览','<p>你正在浏览本地 HTML，没有连接运行中的应用。可以关闭这个浏览器标签页，或继续查看设置。</p>','<button type="button" class="button primary" data-close>继续查看设置</button>');
case 'clear-search':$('search').value='';return searchResults('');
case 'config':return openDialog('预览配置','<p>下面是当前预览值与演示记录。正式接入时按各功能的配置归属写入；这份 JSON 不能直接导入 Harness。</p><pre class="code-preview">'+esc(JSON.stringify(previewConfig(),null,2))+'</pre>',button('导出预览 JSON','export-config','download')+'<button type="button" class="button" data-close>关闭</button>',null,true);
case 'export-config':download('cinlan-settings-preview.json',JSON.stringify(previewConfig(),null,2)+'\n','application/json');return toast('预览配置已导出');
case 'reset':return openDialog('恢复本页默认值？','<p>“'+PAGES[active].label+'”的选项将恢复为初始预览值，已添加的演示记录会保留。</p>',cancelButton+'<button type="submit" class="button primary">恢复默认值</button>',()=>{for(const key of Object.keys(state.values))if(key.startsWith(active+'.'))delete state.values[key];persist();applyTheme();$('dialog').close();renderPage(true);toast('本页已恢复默认值');});
case 'test-notification':return openDialog('通知预览','<div class="resource-list"><div class="resource"><div class="resource-symbol">'+icon('bell')+'</div><div class="resource-copy"><div class="resource-title">Cinlan Harness</div><p class="resource-description">编程助手已完成“优化设置搜索”</p><p class="resource-description">刚刚 · 点击通知可回到对应会话</p></div></div></div><p class="inline-tip">这里仅预览通知样式，不申请浏览器通知权限。</p>');
case 'version':return openDialog('版本信息','<p><strong>Cinlan Harness · 设置交互预览</strong></p><p>独立 HTML，无需安装或联网。应用更新检查在正式应用中由桌面版本管理。</p>');
case 'credentials':return openDialog('凭据与普通设置分开保存','<p>提供商配置保留服务地址、模型与凭据引用。API Key 和访问令牌由主机凭据服务单独保存，不写入普通偏好文档。</p><p>此预览不采集任何真实密钥，导出的 JSON 也不包含密钥。</p>');
case 'microphone':return openDialog('麦克风权限','<p>正式听写需要你为浏览器或桌面应用授权麦克风。本地识别模型在主机运行，识别文字进入会话草稿。</p><p>此预览不会启动录音或申请权限。</p>');
case 'dictation':return openDialog('语音识别结果','<p>听写完成后，文字先进入草稿。</p><div class="form-row"><label for="voice-draft">草稿预览</label><textarea id="voice-draft">帮我检查当前工作区的改动，重点关注设置保存和错误处理。</textarea></div><p class="inline-tip">示例文字可编辑，不会发送给智能体。</p>');
case 'issue-links':return openDialog('工单关联','<p><strong>#42 优化设置搜索体验</strong></p><table class="mapping"><tr><td>来源</td><td>GitHub · cinlan-harness</td></tr><tr><td>工作区</td><td>settings-search</td></tr><tr><td>会话</td><td>设置搜索实现与验证</td></tr></table><p>正式能力支持关联已存在的工作区和会话。写入外部工单前，先预览影响并单独确认。</p>');
case 'leases':return openDialog('隔离工作区记录',resources([{name:'settings-search',detail:'Git Worktree · cinlan/settings-search',icon:'worktree',status:'活动'},{name:'docs-onboarding',detail:'Git Worktree · cinlan/docs-onboarding',icon:'worktree',status:'休眠'}],'',()=>'' )+'<p class="inline-tip">示例记录。真实工作区的合并、导出和回收由对应主机能力执行。</p>');
case 'browser-data':return openDialog('浏览会话数据','<p>当前浏览配置：<strong>'+esc(val('browser','profile')==='work'?'工作':'临时会话')+'</strong></p><p>正式接入后，可按主机管理 Cookie、站点存储和登录状态。</p><p class="form-help">这份预览不读取或清除真实浏览器数据。</p>');
case 'capture-preview':return openDialog('元素捕获预览','<div class="resource-list"><div class="resource"><div class="resource-symbol">'+icon('capture')+'</div><div class="resource-copy"><div class="resource-title">按钮 · 保存设置</div><p class="resource-description">来源：https://example.com/settings</p></div></div></div><pre class="code-preview">'+esc(JSON.stringify({role:'button',name:'保存设置',...(val('capture','selector')?{selector:'button[data-action="save"]'}:{}),...(val('capture','styles')?{style:{height:'36px',borderRadius:'18px'}}:{}),...(val('capture','dom')?{html:'<button data-action="save">保存设置</button>'}:{})},null,2))+'</pre><p class="form-help">示例按照当前选项生成，不会读取真实页面。</p>');
case 'design-capabilities':return openDialog('设计能力分工','<table class="mapping"><tr><td>界面与原型</td><td>生成可编辑的页面与交互产物。</td></tr><tr><td>页面检查</td><td>通过浏览器与元素捕获检查实际布局。</td></tr><tr><td>资源生成</td><td>由独立的图像或媒体提供程序管理。</td></tr><tr><td>导出</td><td>保留源文件、预览和资源清单。</td></tr></table><p>这里只展示扩展方向，未安装或调用设计技能。</p>');
case 'plugin-roadmap':return openDialog('插件扩展方案','<p>当前先保留清单与配置入口。未来安装流程可以独立提供来源选择、权限查看、版本与回滚。</p><p>插件启停涉及运行中的服务和会话，应由桌面或主机的插件事务管理，不能用一个偏好开关代替。</p>');
case 'export-usage':{const f=(val('usage','period')==='30'?4.2:1)*(val('usage','model')==='all'?1:val('usage','model')==='deepseek'?.65:.35);download('cinlan-usage-example.csv','\uFEFF类型,周期,模型,Token,请求数,活跃会话\n示例数据,'+val('usage','period')+' 天,'+val('usage','model')+','+Math.round(1280000*f)+','+Math.round(186*f)+','+Math.round(24*f)+'\n','text/csv;charset=utf-8');return toast('示例统计已导出');}
}}
function editShortcut(id){const row=rowFor('shortcuts',id);shortcutDraft=val('shortcuts',id);openDialog('修改“'+row.label+'”快捷键','<p>点击下面的输入框，然后按下新的组合键。</p><div class="form-row"><label for="shortcut-record">组合键</label><input class="field" id="shortcut-record" readonly value="'+esc(shortcutDraft)+'" aria-describedby="shortcut-help"><span class="form-help" id="shortcut-help">支持 Ctrl、Alt、Shift 与普通按键。Esc 关闭对话框。</span></div>',cancelButton+saveButton,()=>{const conflict=PAGES.shortcuts.sections.flatMap(s=>s.rows).find(r=>r.id!==id&&val('shortcuts',r.id)===shortcutDraft);if(conflict)return formError('此组合键已用于“'+conflict.label+'”，请使用其他按键。');change('shortcuts',id,shortcutDraft);$('dialog').close();renderPage(true);toast('快捷键已保存到预览');});$('shortcut-record').focus();$('shortcut-record').addEventListener('keydown',e=>{if(['Control','Shift','Alt','Meta','Tab','Escape'].includes(e.key))return;e.preventDefault();e.stopPropagation();shortcutDraft=[e.ctrlKey||e.metaKey?'Ctrl':'',e.altKey?'Alt':'',e.shiftKey?'Shift':'',e.key===' '?'Space':e.key.length===1?e.key.toUpperCase():e.key].filter(Boolean).join(' + ');$('shortcut-record').value=shortcutDraft;$('form-error')?.remove();});}
$('navigation').addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p)return navigate(p.dataset.page);const g=e.target.closest('[data-group]');if(g){state.folded[g.dataset.group]=!state.folded[g.dataset.group];renderNav();}});
$('search').addEventListener('input',e=>searchResults(e.target.value));
$('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&query){$('shell').classList.remove('nav-open');$('page').querySelector('.search-result')?.focus();}});
$('page').addEventListener('change',e=>{const control=e.target.closest('[data-setting]');if(!control)return;const [page,id]=control.dataset.setting.split('.');if(page==='issues'&&id==='defaultSource'&&!val('issues',control.value)){control.value=val(page,id);return toast('请先启用对应的工单来源');}change(page,id,control.value);if(page==='general'&&id==='language')toast('语言偏好已保存；此原型固定展示简体中文');if(['terminal','usage'].includes(page)||PAGES[page].sections.some(s=>s.rows.some(r=>r.dependsSelect?.[0]===id)))renderPage(true);});
$('page').addEventListener('click',e=>{const theme=e.target.closest('[data-theme-choice]');if(theme){change('general','theme',theme.dataset.themeChoice);renderPage(true);return;}
const sw=e.target.closest('.switch[data-setting]');if(sw&&!sw.disabled){const [p,id]=sw.dataset.setting.split('.');const next=!val(p,id);if(p==='issues'&&['github','linear'].includes(id)&&!next&&!val(p,id==='github'?'linear':'github'))return toast('请至少保留一个工单来源');change(p,id,next);if(p==='issues'&&!next&&val(p,'defaultSource')===id)change(p,'defaultSource',id==='github'?'linear':'github');renderPage(true);$('row-'+p+'.'+id)?.querySelector('button')?.focus({preventScroll:true});return;}
const step=e.target.closest('[data-step]');if(step&&!step.disabled){const[p,id]=step.dataset.step.split('.');const row=rowFor(p,id);change(p,id,Math.max(row.min,Math.min(row.max,Number(val(p,id))+Number(step.dataset.delta))));renderPage(true);return;}
const result=e.target.closest('[data-result-page]');if(result)return navigate(result.dataset.resultPage,result.dataset.resultRow);
const shortcut=e.target.closest('[data-shortcut]');if(shortcut)return editShortcut(shortcut.dataset.shortcut);
const tab=e.target.closest('[data-plugin-tab]');if(tab){state.pluginTab=tab.dataset.pluginTab;renderPage(true);return;}
const plan=e.target.closest('[data-plan-toggle]');if(plan){const record=state.lists.automations.find(r=>r.id===plan.dataset.planToggle);record.enabled=!record.enabled;record.status=record.enabled?'已启用（模拟）':'已暂停';persist();renderPage(true);toast(record.enabled?'演示计划已启用，不会实际调度':'演示计划已暂停');}});
document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close){$('dialog').close();return;}const actionElement=e.target.closest('[data-action]');if(actionElement){e.preventDefault();runAction(actionElement.dataset.action);}});
$('dialog-form').addEventListener('submit',e=>{e.preventDefault();if(dialogSubmit)dialogSubmit(new FormData(e.currentTarget));});
$('dialog-close').addEventListener('click',()=>$('dialog').close());
$('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const b=$('dialog').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('dialog').close();}});
$('mobile-menu').addEventListener('click',()=>$('shell').classList.add('nav-open'));
$('scrim').addEventListener('click',()=>$('shell').classList.remove('nav-open'));
document.addEventListener('keydown',e=>{if($('dialog').open)return;if((e.ctrlKey||e.metaKey)&&['k','f'].includes(e.key.toLowerCase())){e.preventDefault();if(innerWidth<=700)$('shell').classList.add('nav-open');$('search').focus();$('search').select();}if(e.key==='Escape'){if(query){$('search').value='';searchResults('');}else $('shell').classList.remove('nav-open');}});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(PAGES[page])navigate(page);});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(val('general','theme')==='system')applyTheme();});
hydrateIcons();applyTheme();renderNav();renderPage();if(!storageAvailable)$('save-status').textContent='本地存储不可用 · 仅本次预览';

</script>
</body>
</html>

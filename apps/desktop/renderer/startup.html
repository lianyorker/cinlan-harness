<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>{{startupTitle}}</title>
    <link rel="stylesheet" href="startup-theme.css">
    <link rel="stylesheet" href="startup.css">
  </head>
  <body data-phase="starting" data-stage="opening">
    <main aria-labelledby="startup-title">
      <div class="mark" aria-hidden="true">D</div>
      <h1 id="startup-title">{{startupTitle}}</h1>
      <p id="startup-detail">{{startupDescription}}</p>
      <div class="stage" role="status" aria-live="polite" aria-atomic="true">
        <span class="activity" aria-hidden="true"></span>
        <span id="stage-label">{{startupOpening}}</span>
      </div>
      <section id="failure" role="alert" hidden>
        <p id="error-message"></p>
        <p id="diagnostic-label">{{startupDiagnostic}}</p>
        <code id="diagnostic-path"></code>
      </section>
      <div class="actions">
        <button id="restart" class="primary" type="button" hidden>{{startupRestart}}</button>
        <button id="quit" type="button">{{startupQuit}}</button>
      </div>
    </main>
    <script src="startup.js"></script>
  </body>
</html>
